<title>Valuation Valley</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: storybook valley. Sky-and-hills banner on top, one centred stage; inside a level the question sits left and the case exhibit stays pinned on the right. Bright single look on purpose (Columbia blues, gold coins, wood accents). */
:root {
  --sky: #eef6fc;
  --sky-2: #d3e8f6;
  --cu-blue: #b9d9eb;
  --hill-2: #8fbfe0;
  --hill-3: #5d9bcf;
  --blue: #2a6db0;
  --blue-dark: #1d4f91;
  --navy: #16325c;
  --ink: #1b2d4f;
  --muted: #5d6f8c;
  --line: #d6e4f0;
  --card: #ffffff;
  --gold: #f4b63f;
  --gold-dark: #b97c0c;
  --heart: #ef5d72;
  --leaf: #2f9a68;
  --leaf-soft: #e2f4eb;
  --oops: #d9534f;
  --oops-soft: #fdecea;
  --wood: #c88a52;
  --wood-soft: #f7ead9;
  --mane: #f0a24a;
  --fur: #f9d58f;
  --bs-ev: #2f5486;
  --bs-nonop: #d06c3c;
  --bs-debt: #46946d;
  --bs-eq: #8590a8;
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: linear-gradient(180deg, var(--sky-2) 0, var(--sky) 320px) fixed, var(--sky);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.5;
}
.stage {
  max-width: 1060px; margin: 0 auto; min-height: 100%;
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--f-display); color: var(--navy); line-height: 1.15; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* buttons */
.btn {
  appearance: none; border: 0; cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 18px;
  padding: 10px 22px 8px; border-radius: 999px; background: var(--card); color: var(--blue-dark);
  box-shadow: inset 0 0 0 2px var(--cu-blue), 0 3px 0 var(--cu-blue); transition: transform 0.12s, box-shadow 0.12s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--cu-blue), 0 1px 0 var(--cu-blue); }
.btn.primary { background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-dark); }
.btn.primary:active { box-shadow: 0 1px 0 var(--blue-dark); }
.btn.gold { background: var(--gold); color: var(--navy); box-shadow: 0 4px 0 var(--gold-dark); }
.btn[disabled] { opacity: 0.45; cursor: default; transform: none; }
.btn.small { font-size: 15px; padding: 7px 14px 5px; }
.link { appearance: none; border: 0; background: none; padding: 0; color: var(--muted); font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* banner */
.banner { display: block; width: 100%; height: auto; max-height: 190px; border-radius: 22px; background: var(--sky-2); }
.banner .far { fill: var(--cu-blue); }
.banner .mid { fill: var(--hill-2); }
.banner .near { fill: var(--hill-3); }
.banner .pine { fill: var(--blue-dark); opacity: 0.75; }
.banner .sun { fill: #ffe39c; }
.banner .cloud { fill: #ffffff; opacity: 0.9; }

/* title */
.title-screen { display: grid; gap: 22px; padding-top: 6px; }
.title-hero { position: relative; }
.title-hero .lion-big { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); width: clamp(110px, 18vw, 150px); }
.title-text { display: grid; gap: 10px; justify-items: center; text-align: center; padding-top: 26px; }
.game-name { font-size: clamp(44px, 8vw, 72px); font-weight: 800; color: var(--blue-dark); letter-spacing: -0.01em; }
.tagline { font-size: 20px; color: var(--muted); }
.rules { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 10px; max-width: 520px; text-align: left; }
.rules li { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 16px; padding: 10px 14px; box-shadow: 0 2px 0 var(--line); }
.rules svg { flex: none; }

/* top bar (hub and level) */
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 24px; color: var(--blue-dark); }
.brand svg { width: 42px; height: 42px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 800; box-shadow: 0 2px 0 var(--line); font-variant-numeric: tabular-nums; }
.pill svg { width: 24px; height: 24px; }
.pill.toolbtn { cursor: pointer; border: 0; font: inherit; font-weight: 800; color: var(--ink); }
.pill.toolbtn[disabled] { opacity: 0.4; cursor: default; }
.pill.toolbtn:not([disabled]):hover { box-shadow: 0 2px 0 var(--line), inset 0 0 0 2px var(--cu-blue); }
.hearts { display: flex; gap: 2px; padding: 4px 8px; }
.hearts svg { width: 24px; height: 24px; }
.hearts.ouch { animation: ouch 0.45s ease; }
@keyframes ouch { 0%,100% { transform: none; } 20% { transform: translateX(-5px) scale(1.06); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }

/* hub */
.hub-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: end; margin-top: 16px; }
.owner { width: 74px; height: 74px; }
.bubble { position: relative; background: var(--card); border-radius: 20px; padding: 14px 18px; box-shadow: 0 3px 0 var(--line); max-width: 720px; }
.bubble::before { content: ""; position: absolute; left: -9px; bottom: 18px; border: 10px solid transparent; border-right-color: var(--card); border-left: 0; }
.bubble .who { font-family: var(--f-display); font-weight: 700; color: var(--wood); font-size: 15px; }
.bubble .say { font-size: 18px; }
.hub-grid { margin-top: 24px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.panel { background: var(--card); border-radius: 22px; padding: 18px; box-shadow: 0 3px 0 var(--line); min-width: 0; }
.panel-title { font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--navy); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel-title small { font-family: var(--f-body); font-weight: 600; font-size: 13px; color: var(--muted); }

.mvbs-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 280px; gap: 6px; }
.mvbs-head { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-weight: 800; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.mvbs-col { display: grid; gap: 6px; min-width: 0; }
.mvbs-col.assets { grid-template-rows: 4fr 1.1fr; }
.mvbs-col.claims { grid-template-rows: 3.3fr 1.8fr; }
.blk { border-radius: 12px; padding: 10px 12px; color: #fff; display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0; }
.blk.ev { background: var(--bs-ev); }
.blk.nonop { background: var(--bs-nonop); }
.blk.eq { background: var(--bs-eq); }
.blk.debt { background: var(--bs-debt); }
.blk.unknown { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.10) 0 8px, transparent 8px 16px); }
.blk .bl { font-weight: 800; font-size: 15px; line-height: 1.2; }
.blk .bs { font-size: 13px; opacity: 0.9; line-height: 1.25; }
.blk .bv { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.blk.unknown .bv { opacity: 0.6; }
.blk.pop { animation: pop 0.9s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { 0% { transform: scale(0.9); filter: brightness(1.3); } 60% { transform: scale(1.04); } 100% { transform: none; filter: none; } }

.trail { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.stop { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; position: relative; padding: 8px 0; }
.stop:not(:last-child)::after { content: ""; position: absolute; left: 27px; top: 58px; bottom: -8px; border-left: 3px dashed var(--cu-blue); }
.stop .node { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--sky); box-shadow: inset 0 0 0 3px var(--cu-blue); position: relative; z-index: 1; }
.stop.open .node { background: var(--card); box-shadow: inset 0 0 0 3px var(--blue); }
.stop.done .node { background: var(--leaf-soft); box-shadow: inset 0 0 0 3px var(--leaf); }
.stop .node svg { width: 30px; height: 30px; }
.stop .nm { font-family: var(--f-display); font-weight: 700; font-size: 19px; color: var(--navy); line-height: 1.1; }
.stop .tp { font-size: 14.5px; color: var(--muted); }
.stop.locked .nm, .stop.locked .tp { opacity: 0.6; }
.chip { display: inline-block; font-size: 12.5px; font-weight: 800; padding: 1px 9px; border-radius: 999px; margin-top: 3px; }
.chip.done { background: var(--leaf-soft); color: var(--leaf); }
.chip.locked { background: var(--sky); color: var(--muted); }
.top-right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.reset-zone { background: var(--card); border-radius: 18px; padding: 12px 16px; margin-bottom: 14px; box-shadow: inset 0 0 0 2px var(--cu-blue); display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; font-weight: 700; }
.reset-zone:empty { display: none; }
.pill.music.on { box-shadow: 0 2px 0 var(--line), inset 0 0 0 2px var(--blue); color: var(--blue-dark); }
.credit { font-size: 13px; color: var(--muted); }
.credit a { color: var(--muted); }
.title-top { display: flex; justify-content: flex-end; }
.title-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.hub-foot { margin-top: 30px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 14px; }

/* shop */
.shop { display: grid; gap: 18px; }
.shop-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.shop-head .lion-mid { width: 84px; height: 84px; }
.tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.tool { background: var(--card); border-radius: 22px; padding: 18px; box-shadow: 0 3px 0 var(--line); display: grid; gap: 8px; align-content: start; min-width: 0; }
.tool .ic { width: 58px; height: 58px; border-radius: 18px; background: var(--sky); display: grid; place-items: center; }
.tool .ic svg { width: 40px; height: 40px; }
.tool .tn { font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--navy); }
.tool .td { font-size: 15.5px; color: var(--muted); }
.tool .tb { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.tool .owned { font-size: 14px; font-weight: 800; color: var(--blue-dark); }
.price { display: inline-flex; align-items: center; gap: 4px; }
.price svg { width: 18px; height: 18px; }
.shop-msg { min-height: 1.4em; font-weight: 700; color: var(--muted); }
.shop-actions { display: flex; gap: 12px; flex-wrap: wrap; }

/* level */
.lvl-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.lvl-name { font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--blue-dark); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.dots { display: inline-flex; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2px var(--cu-blue); }
.dot.done { background: var(--leaf); box-shadow: none; }
.dot.now { background: var(--blue); box-shadow: 0 0 0 3px var(--cu-blue); }
.lvl-grid { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 24px; align-items: start; }
.lvl-grid.wide { grid-template-columns: minmax(0, 1fr); }
.ask { display: grid; gap: 16px; min-width: 0; }
.ask-top { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; }
.ask-top .lion-sm { width: 64px; height: 64px; }
.prompt { font-family: var(--f-display); font-weight: 700; font-size: clamp(21px, 2.8vw, 26px); color: var(--navy); line-height: 1.25; }
.prompt .item { color: var(--blue); }
.sub { color: var(--muted); font-size: 16px; margin-top: 4px; }

.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.choice {
  appearance: none; border: 0; cursor: pointer; text-align: left; font: inherit; color: var(--ink); position: relative;
  background: var(--card); border-radius: 20px; padding: 14px 14px 16px; display: grid; gap: 6px; align-content: start;
  box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 var(--line); transition: transform 0.12s, box-shadow 0.12s;
}
.choice:not([disabled]):hover { transform: translateY(-3px); box-shadow: inset 0 0 0 2px var(--blue), 0 6px 0 var(--cu-blue); }
.choice .ck { display: flex; align-items: center; justify-content: space-between; }
.choice .ck svg { width: 34px; height: 34px; }
.choice .key { font-size: 13px; font-weight: 800; color: var(--muted); }
.choice .cn { font-family: var(--f-display); font-weight: 700; font-size: 19px; color: var(--navy); line-height: 1.15; }
.choice .cd { font-size: 14.5px; color: var(--muted); line-height: 1.35; }
.choice[disabled] { cursor: default; }
.choice.wrong { background: var(--oops-soft); box-shadow: inset 0 0 0 2px var(--oops); opacity: 0.75; }
.choice.wrong::after { content: "\2715"; position: absolute; top: 10px; right: 12px; color: var(--oops); font-weight: 800; }
.choice.right { background: var(--leaf-soft); box-shadow: inset 0 0 0 3px var(--leaf), 0 4px 0 var(--leaf); }
.choice.crossed { opacity: 0.35; text-decoration: line-through; }
.choice.dim { opacity: 0.5; }

.statements { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.stmt {
  appearance: none; border: 0; cursor: pointer; text-align: left; font: inherit; color: var(--ink); position: relative;
  background: var(--card); border-radius: 20px; padding: 14px 16px 16px; box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 var(--line);
  transition: transform 0.12s, box-shadow 0.12s; min-width: 0;
}
.stmt:not([aria-disabled="true"]):hover { transform: translateY(-3px); box-shadow: inset 0 0 0 2px var(--blue), 0 6px 0 var(--cu-blue); }
.stmt[aria-disabled="true"] { cursor: default; }
.stmt.wrong { background: var(--oops-soft); box-shadow: inset 0 0 0 2px var(--oops); }
.stmt.right { background: var(--leaf-soft); box-shadow: inset 0 0 0 3px var(--leaf), 0 4px 0 var(--leaf); }
.stmt.crossed { opacity: 0.4; }
.stmt h3 { font-size: 18px; margin-bottom: 6px; }

.ex { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.ex td { padding: 3px 8px; }
.ex td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 700; }
.ex tr.sub td { color: var(--muted); padding-left: 22px; font-weight: 600; }
.ex tr.total td { border-top: 1.5px solid var(--line); font-weight: 800; }
.ex tr.gap td { height: 8px; padding: 0; }
.sheet { position: sticky; top: 12px; }
.sheet .ex tr.hl td { background: #fff3c4; }
.sheet .ex tr.hl td:first-child { border-radius: 8px 0 0 8px; box-shadow: inset 4px 0 0 var(--gold); }
.sheet .ex tr.hl td:last-child { border-radius: 0 8px 8px 0; }
.ex-scroll { overflow-x: auto; }

.pickable td { cursor: pointer; }
.pickable:hover td { background: var(--sky); }
.pickable td:first-child { position: relative; padding-left: 34px; }
.pickable td:first-child::before { content: ""; position: absolute; left: 8px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--cu-blue); background: var(--card); }
.pickable.on td { background: #e6f0fb; }
.pickable.on td:first-child::before { background: var(--blue); box-shadow: none; }
.pickable.on td:first-child::after { content: ""; position: absolute; left: 13px; top: 50%; width: 5px; height: 9px; margin-top: -6px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.ex .tag { display: inline-block; margin-left: 8px; font-size: 11.5px; font-weight: 800; padding: 0 7px; border-radius: 999px; color: #fff; vertical-align: 1px; }
.ex .tag.nonop { background: var(--bs-nonop); }
.ex .tag.debt { background: var(--bs-debt); }
.static-row td:first-child { padding-left: 34px; }

.verdict { border-radius: 18px; padding: 12px 16px; font-size: 16.5px; }
.verdict.good { background: var(--leaf-soft); }
.verdict.bad { background: var(--oops-soft); }
.verdict strong { font-family: var(--f-display); font-size: 18px; }
.verdict.good strong { color: var(--leaf); }
.verdict.bad strong { color: var(--oops); }
.verdict .gain { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; color: var(--gold-dark); white-space: nowrap; }
.verdict .gain svg { width: 18px; height: 18px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* Level 2: 1996 pro forma, assumptions, FCF ladder */
.ledger-col { display: grid; gap: 24px; min-width: 0; }
.build { width: 100%; border-collapse: collapse; font-size: 16px; }
.build td { padding: 5px 10px; }
.build td:nth-child(2) { color: var(--muted); font-size: 14px; white-space: nowrap; }
.build td:last-child { text-align: right; font-family: var(--f-display); font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.build tr.sum td { border-top: 1.5px solid var(--line); }
.build tr.nop td { color: var(--blue-dark); font-weight: 800; }
.build tr.cur td { background: #fff3c4; }
.build tr.cur td:first-child { border-radius: 8px 0 0 8px; box-shadow: inset 4px 0 0 var(--gold); }
.build tr.cur td:last-child { border-radius: 0 8px 8px 0; }
.build .q, .ladder .unk { color: var(--cu-blue); }
.assume { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.assume th, .assume td { padding: 4px 8px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.assume th:first-child, .assume td:first-child { text-align: left; }
.assume th { font-size: 13px; color: var(--muted); font-weight: 800; }
.assume tr.hl td { background: #fff3c4; }
.choice .cn.big { font-size: 28px; }
.ladder { width: 100%; border-collapse: collapse; font-size: 16px; }
.ladder td { padding: 6px 10px; }
.ladder td:last-child { text-align: right; font-family: var(--f-display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.ladder tr.fcf td { border-top: 2px solid var(--navy); font-weight: 800; }
.ladder .from { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-left: 4px; }
.ladder .val { display: inline-block; color: var(--blue-dark); }
.ladder .val.pop { animation: pop 0.9s cubic-bezier(.2,1.6,.4,1); }

.stmt.on { box-shadow: inset 0 0 0 3px var(--blue), 0 4px 0 var(--cu-blue); background: #f2f8fe; }
.stmt.on h3::after { content: " ✓"; color: var(--blue); }
.ex tr.detail td { color: var(--muted); padding-left: 22px; font-size: 13.5px; font-weight: 600; }
.ex tr.detail td:last-child { font-weight: 600; }
.build.inv th { font-size: 13px; color: var(--muted); font-weight: 800; text-align: right; padding: 4px 10px; }
.build.inv td:nth-child(2), .build.inv td:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; font-size: 15.5px; }
.build.inv td:nth-child(2) { color: var(--muted); }
.build.inv td:nth-child(3) { color: var(--ink); }

.river { display: block; width: 100%; height: auto; }
.river .band { fill: var(--cu-blue); }
.river .wave { fill: none; stroke: #ffffff; stroke-width: 1.4; opacity: 0.7; }
.river .yrtxt { font: 700 12px var(--f-body); fill: var(--blue-dark); text-anchor: middle; }
.river .band-txt { fill: var(--navy); }
.river .today { fill: var(--gold); stroke: var(--gold-dark); stroke-width: 1.5; }
.river .bar.pos { fill: var(--blue); }
.river .bar.neg { fill: var(--bs-nonop); }
.river .first .bar { fill: var(--gold); }
.river .wrong .bar { fill: #ecb8b4; }
.river .val { font: 800 13px var(--f-display); fill: var(--navy); text-anchor: middle; }
.river .gr { font: 700 12px var(--f-body); fill: var(--muted); text-anchor: middle; }
.river .yr { cursor: pointer; outline: none; }
.river .yr .hit { fill: transparent; }
.river .yr:hover .hit, .river .yr:focus-visible .hit { fill: var(--sky); stroke: var(--cu-blue); stroke-width: 2; }
.river .mark { font: 800 13px var(--f-display); fill: var(--navy); text-anchor: middle; }
.river .arrow { fill: none; stroke: var(--gold-dark); stroke-width: 2.2; }

    if (k === "logs") return '<svg viewBox="0 0 30 30" aria-hidden="true"><g fill="none" stroke="' + c + '" stroke-width="2.2"><circle cx="9" cy="20" r="4.5"/><circle cx="21" cy="20" r="4.5"/><circle cx="15" cy="11" r="4.5"/></g></svg>';

    return '<svg viewBox="0 0 30 30" aria-hidden="true"><g fill="none" stroke="' + c + '" stroke-width="2.2"><ellipse cx="15" cy="22" rx="8" ry="3"/><ellipse cx="15" cy="16" rx="8" ry="3"/><ellipse cx="15" cy="10" rx="8" ry="3"/></g></svg>';
  }
  function noteIcon(on) {

      '<ellipse cx="6.6" cy="17.6" rx="2.9" ry="2.3" fill="var(--blue-dark)"/><ellipse cx="16.6" cy="15.3" rx="2.9" ry="2.3" fill="var(--blue-dark)"/>' +
      (on ? "" : '<path d="M3 3l18 18" stroke="var(--oops)" stroke-width="2.2" stroke-linecap="round"/>') + "</svg>";
  }
  function musicBtn() {
    return '<button class="pill toolbtn music' + (musicOn ? " on" : "") + '" data-act="music" aria-pressed="' + (musicOn ? "true" : "false") + '" title="Music on or off">' + noteIcon(musicOn) + (musicOn ? "On" : "Off") + "</button>";
  }
  function lockIcon() { return '<svg viewBox="0 0 30 30" aria-hidden="true"><rect x="7" y="13" width="16" height="12" rx="3" fill="#c9d6e3"/><path d="M10 13v-3a5 5 0 0 1 10 0v3" fill="none" stroke="#c9d6e3" stroke-width="2.6"/></svg>'; }
  function starIcon() { return '<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M15 4l3.3 6.9 7.5 1-5.5 5.2 1.4 7.5L15 21l-6.7 3.6 1.4-7.5-5.5-5.2 7.5-1z" fill="var(--gold)" stroke="var(--gold-dark)" stroke-width="1.2"/></svg>'; }
  function banner() {
    return '<svg class="banner" viewBox="0 0 1000 170" preserveAspectRatio="xMidYMax slice" aria-hidden="true">' +
      '<circle class="sun" cx="860" cy="52" r="28"/>' +
      '<g class="cloud"><ellipse cx="170" cy="48" rx="46" ry="14"/><ellipse cx="200" cy="38" rx="28" ry="16"/><ellipse cx="560" cy="34" rx="38" ry="11"/><ellipse cx="585" cy="27" rx="22" ry="12"/></g>' +
      '<path class="far" d="M0 118C120 72 240 70 360 102S600 62 740 84 930 78 1000 92V170H0z"/>' +
      '<g class="pine"><path d="M300 112l10-24 10 24z"/><path d="M318 114l8-19 8 19z"/><path d="M770 100l9-22 9 22z"/><path d="M786 103l7-17 7 17z"/></g>' +
      '<path class="mid" d="M0 140C150 100 260 124 400 134S640 104 800 118 960 120 1000 124V170H0z"/>' +
      '<g class="pine"><path d="M120 128l11-26 11 26z"/><path d="M600 124l10-24 10 24z"/><path d="M617 127l8-19 8 19z"/></g>' +
      '<path class="near" d="M0 160C200 136 380 150 520 154S820 140 1000 150V170H0z"/></svg>';
  }

  // ======================= flow =======================
  function goHub() { run = null; view = save.email ? "hub" : "title"; render(); }   // no email yet: ask for it first
  function openShop(level) { view = "shop"; shopMsg = ""; run = { level: level }; render(); }

  function buy(k) {
    var t = TOOLS[k];
    if (save.coins < t.price) { shopMsg = "Not enough coins for the " + t.name.toLowerCase() + " yet."; render(); return; }
    save.coins -= t.price; save.inv[k] = (save.inv[k] || 0) + 1; persist();
    shopMsg = "Got it: " + t.name.toLowerCase() + ".";
    render();
  }

  function startLevel(level) {
    var maxHp = BASE_HP;
    if (save.inv.snack > 0) { save.inv.snack -= 1; maxHp += 1; persist(); }
    run = { level: level, step: 0, items: LV[level].draw ? LV[level].draw() : [], hp: maxHp, maxHp: maxHp, earned: 0, misses: 0, gtry: 5,
            answered: false, verdict: null, wrong: [], crossed: null, missedHere: false, mood: "happy",
            pass: "nonop", sel: {}, tagged: {}, bi: 0, order: null, stmtSel: {}, place: {}, selCard: null, locked: {}, typed: {}, cardOrder: null, ouch: false };
    if (LV[level].match) run.cardOrder = shuffle(m5()[0].cards.map(function (c) { return c.id; }));
    view = "level"; render();
  }

  function resetStepState() { run.answered = false; run.verdict = null; run.wrong = []; run.crossed = null; run.missedHere = false; run.mood = "happy"; }

  function loseHeart() {
    if (save.inv.hat > 0) { save.inv.hat -= 1; persist(); return "The hard hat takes the hit. No heart lost."; }
    run.hp -= 1; run.ouch = true; return null;
  }
  function award(n) { save.coins += n; run.earned += n; persist(); return n; }
  function miss(text) {
    run.misses += 1; run.missedHere = true; run.mood = "oops";
    var saved = loseHeart();
    run.verdict = { good: false, html: text + (saved ? " " + esc(saved) : "") };
    if (run.hp <= 0) { die(); return; }
    render();
  }
  function hit(title, text) {
    var g = award(run.missedHere ? 3 : 10);
    run.answered = true; run.mood = "cheer";
    run.verdict = { good: true, html: "<strong>" + title + "</strong> " + text + gainHtml(g) };
    render(); focusNext();
  }

  // step 1: which statement (Level 3: pick one or both, then check)
  function toggleStmt(which) {
    if (run.answered || run.step !== 0) return;
    run.stmtSel[which] = !run.stmtSel[which];
    render();
  }
  function checkStmt() {
    if (run.answered || run.step !== 0) return;
    var s = cfg().stmt, inc = !!run.stmtSel.income, bal = !!run.stmtSel.balance;
    if (!inc && !bal) { run.verdict = { good: false, html: "<strong>Pick a table first.</strong> Click one or both, then check." }; render(); return; }
    if (inc && bal) return hit("Yes!", esc(s.ok));
    miss("<strong>Not quite.</strong> " + esc(bal ? s.onlyBalance : s.onlyIncome));
  }
  function answerStatement(which) {
    if (run.answered || run.step !== 0) return;
    var s = cfg().stmt;
    if (s.multi) return toggleStmt(which);
    if (which !== s.answer) {
      if (run.wrong.indexOf(which) >= 0) return;
      run.wrong.push(which);
      return miss("<strong>Not this one.</strong> " + esc(s.wrong));
    }
    hit("Yes!", esc(s.ok));
  }

  // steps 2-4: one line at a time
  function answerCat(cat) {
    if (run.answered || run.step < 1 || run.step > 3) return;
    var key = run.items[run.step - 1], Ln = lineIn(cfg().sheet, key), why = cfg().why[key];
    if (run.wrong.indexOf(cat) >= 0 || run.crossed === cat) return;
    if (cat !== Ln[cfg().key || "cls"]) { run.wrong.push(cat); return miss("<strong>Oops.</strong> " + esc(why[cat])); }
    hit("Right!", esc(why.ok));
  }

  // Levels 2-3, step 5: picks that build a table
  function answerBuild(slot) {
    var C = cfg();
    if (!C.build || run.step !== 4 || run.answered) return;
    var ci = run.order[slot]; if (ci === undefined) return;
    var c = C.build[run.bi].cards[ci];
    if (run.wrong.indexOf(ci) >= 0 || run.crossed === ci) return;
    if (!c.ok) { run.wrong.push(ci); return miss("<strong>Oops.</strong> " + esc(c.why)); }
    hit("Right!", esc(c.why) + (run.bi === C.build.length - 1 ? C.lastExtra() : ""));
  }

  // Level 4: click a year, then four card questions
  function answerYear(y) {
    var C = cfg();
    if (!C.river || run.step !== 0 || run.answered || run.wrong.indexOf(y) >= 0) return;
    if (y !== C.startYear) {
      run.wrong.push(y);
      return miss("<strong>Not this one.</strong> " + esc(y < 2000 ? C.yearWhy.early : (y === 2000 ? C.yearWhy.y2000 : C.yearWhy.late)));
    }
    hit("Yes!", esc(C.yearWhy.ok));
  }
  function answerQuiz(slot) {
    var C = cfg();
    if (!C.quiz || run.step < 1 || run.answered) return;
    var ci = run.order[slot]; if (ci === undefined) return;
    var c = C.quiz[run.step - 1].cards[ci];
    if (run.wrong.indexOf(ci) >= 0 || run.crossed === ci) return;
    if (!c.ok) { run.wrong.push(ci); return miss("<strong>Oops.</strong> " + esc(c.why)); }
    hit("Right!", esc(c.why));
  }

  // Level 5: place cards in slots, then check
  function mStep() { return m5()[run.step]; }
  function cardById(id) { var c = mStep().cards.filter(function (k) { return k.id === id; }); return c[0] || null; }
  function placeCard(cardId, slotId) {
    if (run.answered || run.locked[slotId] || !cardById(cardId)) return;
    Object.keys(run.place).forEach(function (k) { if (run.place[k] === cardId && !run.locked[k]) delete run.place[k]; });
    if (Object.keys(run.place).some(function (k) { return run.place[k] === cardId; })) return;   // locked elsewhere
    run.place[slotId] = cardId; run.selCard = null; run.verdict = null;
    render();
  }
  function clickCard(id) { if (run.answered) return; run.selCard = run.selCard === id ? null : id; render(); }
  function clickSlot(id) {
    if (run.answered || run.locked[id]) return;
    if (run.selCard) return placeCard(run.selCard, id);
    if (run.place[id]) { delete run.place[id]; render(); }
  }
  function checkMatch() {
    if (run.answered) return;
    var M = mStep(), pl = run.place;
    var empty = M.slots.filter(function (sl) { return !pl[sl.id]; }).length;
    if (empty) { run.verdict = { good: false, html: "<strong>Fill every slot first.</strong> " + empty + (empty === 1 ? " slot is" : " slots are") + " still empty." }; render(); return; }
    var wrong;
    if (M.anyOrder) {
      var want = M.slots.map(function (sl) { return sl.ans; });
      wrong = M.slots.filter(function (sl) { return want.indexOf(pl[sl.id]) < 0; }).length;
    } else wrong = M.slots.filter(function (sl) { return pl[sl.id] !== sl.ans; }).length;
    if (!wrong) return hit("Right!", esc(M.ok) + (M.result ? M.result() : ""));
    var hint = "";
    M.slots.forEach(function (sl) { if (!hint && M.hints && M.hints[pl[sl.id]]) hint = M.hints[pl[sl.id]]; });
    if (!hint && M.swap) hint = M.swap(pl);
    miss("<strong>Not yet.</strong> " + wrong + (wrong === 1 ? " card is" : " cards are") + " in the wrong place. " + esc(hint || M.generic));
  }

  function checkTyped() {
    if (run.answered) return;
    var M = mStep(), ty = run.typed || {};
    var empty = M.slots.filter(function (sl) { return !String(ty[sl.id] || "").trim(); }).length;
    if (empty) { run.verdict = { good: false, html: "<strong>Fill every box first.</strong> " + empty + (empty === 1 ? " exponent is" : " exponents are") + " still empty." }; render(); return; }
    var vals = M.slots.map(function (sl) { return Number(String(ty[sl.id]).trim()); });
    var wrong = M.slots.filter(function (sl, i) { return vals[i] !== sl.ans; }).length;
    if (!wrong) return hit("Right!", esc(M.ok) + (M.result ? M.result() : ""));
    var hint = "";
    vals.forEach(function (v) { if (!hint) hint = v > 6 ? M.hints.big : (M.hints["x" + v] || ""); });
    miss("<strong>Not yet.</strong> " + wrong + (wrong === 1 ? " exponent is" : " exponents are") + " off. " + esc(hint || M.generic));
  }

  function useGlass() {
    if (save.inv.glass <= 0 || run.answered || run.crossed !== null) return;
    var options = [];
    if (cfg().match && mStep().typing) {   // the glass fills one exponent and locks it
      var MT = mStep(), openT = MT.slots.filter(function (sl) { return Number(String((run.typed || {})[sl.id] || "").trim()) !== sl.ans || !String((run.typed || {})[sl.id] || "").trim(); });
      if (!openT.length) return;
      var tg = pick(openT);
      run.typed[tg.id] = String(tg.ans); run.locked[tg.id] = true; run.crossed = "glass";
      save.inv.glass -= 1; persist(); render(); return;
    }
    if (cfg().match) {   // the glass places one right card and locks it
      var M = mStep(), want = M.slots.map(function (sl) { return sl.ans; });
      var open = M.slots.filter(function (sl) { return M.anyOrder ? want.indexOf(run.place[sl.id]) < 0 : run.place[sl.id] !== sl.ans; });
      if (!open.length) return;
      var target = pick(open);
      var ans = M.anyOrder ? want.filter(function (a) { return Object.keys(run.place).every(function (k) { return run.place[k] !== a; }); })[0] || target.ans : target.ans;
      Object.keys(run.place).forEach(function (k) { if (run.place[k] === ans) delete run.place[k]; });
      run.place[target.id] = ans; run.locked[target.id] = true; run.crossed = "glass";
      save.inv.glass -= 1; persist(); render(); return;
    }
    if (cfg().quiz) {
      if (run.step === 0) return;
      options = cfg().quiz[run.step - 1].cards.map(function (c, i) { return c.ok ? -1 : i; }).filter(function (i) { return i >= 0 && run.wrong.indexOf(i) < 0; });
    } else if (run.step === 0) {
      if (cfg().stmt.multi) return;
      var other = cfg().stmt.answer === "balance" ? "income" : "balance";
      if (run.wrong.indexOf(other) < 0) options = [other];
    } else if (run.step <= 3) {
      var Ln = lineIn(cfg().sheet, run.items[run.step - 1]);
      options = cfg().cats.map(function (c) { return c.k; }).filter(function (k) { return k !== Ln[cfg().key || "cls"] && run.wrong.indexOf(k) < 0; });
    } else if (cfg().build) {
      options = cfg().build[run.bi].cards.map(function (c, i) { return c.ok ? -1 : i; }).filter(function (i) { return i >= 0 && run.wrong.indexOf(i) < 0; });
    }
    if (!options.length) return;
    save.inv.glass -= 1; persist();
    run.crossed = pick(options);
    render();
  }
  function glassUsable() {
    if (cfg().match) return save.inv.glass > 0 && !run.answered && run.crossed === null;
    if (cfg().quiz) return save.inv.glass > 0 && !run.answered && run.crossed === null && run.step >= 1;
    if (run.step === 0 && cfg().stmt.multi) return false;
    return save.inv.glass > 0 && !run.answered && run.crossed === null && (run.step <= 3 || (run.step === 4 && !!cfg().build));
  }

  // Level 1, step 5: pick the lines, two passes
  function toggleRow(k) {
    if (run.level !== 1 || run.step !== 4 || run.answered || run.tagged[k]) return;
    run.sel[k] = !run.sel[k];
    var row = document.querySelector('[data-row="' + k + '"]');
    if (row) { row.classList.toggle("on", !!run.sel[k]); row.setAttribute("aria-pressed", run.sel[k] ? "true" : "false"); }
  }
  function checkSelection() {
    if (run.level !== 1 || run.step !== 4 || run.answered) return;
    var missing = 0, extra = 0;
    BS.forEach(function (L) {
      if (!L.cls || run.tagged[L.k] || L.optional) return;
      var on = !!run.sel[L.k], need = L.cls === run.pass;
      if (need && !on) missing += 1;
      if (!need && on) extra += 1;
    });
    if (missing || extra) {
      var parts = [];
      if (missing) parts.push(missing + (missing === 1 ? " line is missing" : " lines are missing"));
      if (extra) parts.push(extra + (extra === 1 ? " line doesn't belong" : " lines don't belong"));
      return miss("<strong>Not yet.</strong> " + esc(parts.join(" and ")) + ".");
    }
    BS.forEach(function (L) { if (L.cls === run.pass) run.tagged[L.k] = run.pass; });
    run.sel = {};
    if (run.pass === "nonop") hit("Found it!", "Cash is Clarkson’s only non-operating asset.");
    else hit("All of it!", "Every note payable and both parts of the term loan: all interest-bearing, nothing else.");
  }

  function next() {
    if (!run || !run.answered) return;
    if (run.step === 4) {
      if (run.level === 1 && run.pass === "nonop") { run.pass = "debt"; resetStepState(); render(); window.scrollTo(0, 0); return; }
      if (cfg().build && run.bi < cfg().build.length - 1) { run.bi += 1; run.order = shuffle([0, 1, 2]); resetStepState(); render(); window.scrollTo(0, 0); return; }
      return win();
    }
    run.step += 1; resetStepState();
    if (run.step === 4 && cfg().build) { run.bi = 0; run.order = shuffle([0, 1, 2]); }
    if (cfg().quiz) run.order = shuffle([0, 1, 2]);
    if (cfg().match) { run.place = {}; run.selCard = null; run.locked = {}; run.typed = {}; run.cardOrder = shuffle(mStep().cards.map(function (c) { return c.id; })); }
    render(); window.scrollTo(0, 0);
  }

  function win() {
    var first = !save.done[run.level];
    save.done[run.level] = true; save.clears += 1; save.pop = first ? run.level : 0;
    award(20); persist();
    view = run.level === 5 ? "complete" : "won"; render();
  }
  function die() { save.deaths += 1; persist(); view = "dead"; render(); }

  // Cheat code from the professor: refills the hearts and returns to the same question.
  var CHEAT_HASH = 2835468747;
  function codeHash(t) { var x = 5381; for (var i = 0; i < t.length; i++) x = (x * 33 + t.charCodeAt(i)) >>> 0; return x; }
  function useCheat() {
    var inp = document.getElementById("cheat"), msg = document.getElementById("cheat-msg");
    if (!inp || !run || view !== "dead") return;
    var t = inp.value.replace(/\s+/g, "").toUpperCase();
    if (codeHash(t) !== CHEAT_HASH) { if (msg) msg.textContent = "That’s not the code. Ask your professor."; inp.select(); return; }
    save.cheats = (save.cheats || 0) + 1; persist();
    run.hp = run.maxHp; run.mood = "happy"; run.cheated = true;
    run.verdict = { good: true, html: "<strong>Cheat code accepted.</strong> Hearts refilled. Pick up where you left off." };
    view = "level"; render();
  }

  function gainHtml(n) { return ' <span class="gain">' + coin() + "+" + n + "</span>"; }
  function focusNext() { var b = document.getElementById("next"); if (b) b.focus(); }

  // ======================= award token =======================
  function sha256Hex(str) {   // SHA-256 of the UTF-8 bytes of str, as hex (same as Python's hashlib.sha256)
    var s = unescape(encodeURIComponent(str)), i, j;
    function rot(x, n) { return (x >>> n) | (x << (32 - n)); }
    var K = [], H = [], n = 0, c = 2;
    while (n < 64) {           // first 64 primes: fractional parts of their cube roots (K) and square roots (H)
      var prime = true;
      for (j = 2; j * j <= c; j++) if (c % j === 0) { prime = false; break; }
      if (prime) { if (n < 8) H[n] = (Math.pow(c, 1 / 2) * 4294967296) | 0; K[n] = (Math.pow(c, 1 / 3) * 4294967296) | 0; n++; }
      c++;
    }
    var bytes = [];
    for (i = 0; i < s.length; i++) bytes.push(s.charCodeAt(i));
    var bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (bitLen >>> (i * 8)) & 255);
    for (var off = 0; off < bytes.length; off += 64) {
      var W = [];
      for (i = 0; i < 16; i++) W[i] = (bytes[off + 4 * i] << 24) | (bytes[off + 4 * i + 1] << 16) | (bytes[off + 4 * i + 2] << 8) | bytes[off + 4 * i + 3];
      for (i = 16; i < 64; i++) {
        var s0 = rot(W[i - 15], 7) ^ rot(W[i - 15], 18) ^ (W[i - 15] >>> 3);
        var s1 = rot(W[i - 2], 17) ^ rot(W[i - 2], 19) ^ (W[i - 2] >>> 10);
        W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
      }
      var a = H[0], b = H[1], cc = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (i = 0; i < 64; i++) {
        var t1 = (h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
        var t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + cc) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }
    var hex = "";
    for (i = 0; i < 8; i++) hex += ("00000000" + (H[i] >>> 0).toString(16)).slice(-8);
    return hex;
  }
  function normEmail(s) { return String(s || "").trim().toLowerCase(); }
  function validEmail(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }
  function awardToken(email) {
    var v = parseInt(sha256Hex(TOKEN_GAME + "|" + normEmail(email) + "|" + TOKEN_SECRET).slice(0, 8), 16) >>> 7;   // top 25 bits
    var A = "0123456789ABCDEFGHJKMNPQRSTVWXYZ", out = "";
    for (var i = 4; i >= 0; i--) out += A.charAt((v >>> (5 * i)) & 31);
    return TOKEN_GAME + "-" + out;
  }
  function awardCard() {
    if (!save.done[5] || !save.email) return "";
    return '<div class="award"><p class="lbl">Your award token</p>' +
      '<p class="tok" id="award-token">' + awardToken(save.email) + "</p>" +
      '<p class="for">for ' + esc(save.email) + "</p>" +
      '<p class="paste">Paste this line into Canvas, exactly as shown:</p>' +
      '<code class="line" id="award-line">' + esc(save.email) + " " + awardToken(save.email) + "</code>" +
      '<button class="btn small gold" data-act="copy-token">Copy line</button>' +
      '<p class="copy-msg" id="copy-msg" role="status" aria-live="polite"></p>' +
      '<p class="how">Submit it as your text entry in the Canvas assignment <strong>“' + CANVAS_ITEM + "”</strong> by " + CANVAS_DEADLINE + ".</p></div>";
  }
  function copyToken() {
    var el = document.getElementById("award-line"), msg = document.getElementById("copy-msg");
    function done(ok) { if (msg) msg.textContent = ok ? "Copied! Now paste it into Canvas." : "Select the line above and copy it (Ctrl+C, or Cmd+C on a Mac)."; }
    function bySelection() {
      try { var r = document.createRange(); r.selectNodeContents(el); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); done(document.execCommand("copy")); }
      catch (e) { done(false); }
    }
    if (!el) return;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.textContent).then(function () { done(true); }, bySelection);
    else bySelection();
  }

  // email before the first level: typed, then confirmed (the token depends on it)
  var emailDraft = "", emailPending = null;
  function submitEmail() {
    var inp = document.getElementById("vv-email"), msg = document.getElementById("email-msg");
    var v = normEmail(inp ? inp.value : "");
    if (!validEmail(v)) { if (msg) msg.textContent = "Please type your full email address."; if (inp) inp.focus(); return; }
    emailPending = v; render();
  }
  function confirmEmail() { save.email = emailPending; emailPending = null; emailDraft = ""; persist(); goHub(); }
  function editEmail() { emailDraft = emailPending || ""; emailPending = null; render(); var inp = document.getElementById("vv-email"); if (inp) inp.focus(); }
  function emailBox() {
    if (emailPending) {
      var gsb = /@gsb\.columbia\.edu$/.test(emailPending);
      return '<div class="signin"><p class="who-line">You will play as <strong>' + esc(emailPending) + "</strong>.</p>" +
        (gsb ? "" : '<p class="warn">This is not a @gsb.columbia.edu address. Please use your GSB email.</p>') +
        '<p class="signin-note">Your award token at the end works only with this email. To change it later, you would have to start a new game.</p>' +
        '<div class="title-actions"><button class="btn primary" data-act="email-ok">' + (hasProgress() ? "Yes, continue" : "Yes, start") + '</button><button class="btn" data-act="email-edit">Change it</button></div></div>';
    }
    return '<form class="signin" id="email-form" autocomplete="on"><label for="vv-email">Your GSB email</label>' +
      '<div class="signin-row"><input id="vv-email" name="email" type="email" inputmode="email" autocomplete="email" spellcheck="false" autocapitalize="off" placeholder="you@gsb.columbia.edu" value="' + esc(emailDraft) + '">' +
      '<button class="btn primary" type="submit">' + (hasProgress() ? "Continue" : "Start") + "</button></div>" +
      '<p class="signin-note">You need it for your award token at the end. It stays on this device.</p>' +
      '<p class="signin-msg" id="email-msg" role="status" aria-live="polite"></p></form>';
  }

  function hasProgress() {
    return save.clears > 0 || save.deaths > 0 || save.coins !== START_COINS ||
      Object.keys(save.inv).some(function (k) { return save.inv[k] > 0; });
  }
  function newGame() { save = freshSave(); persist(); run = null; }

  // ======================= views =======================
  function render() {
    var app = document.getElementById("app");
    var html = "";
    if (view === "title") html = vTitle();
    else if (view === "hub") html = vHub();
    else if (view === "shop") html = vShop();
    else if (view === "level") html = vLevel();
    else if (view === "won") html = vWon();
    else if (view === "dead") html = vDead();
    else if (view === "complete") html = vComplete();
    app.innerHTML = html;
    if (run && run.ouch) { run.ouch = false; var h = document.querySelector(".hearts"); if (h) h.classList.add("ouch"); }
    syncMusic();
    if (view !== "level") window.scrollTo(0, 0);
  }

  function pills(withHearts) {
    var h = "";
    if (withHearts) {
      var hs = ""; for (var i = 0; i < run.maxHp; i++) hs += heart(i < run.hp);
      h += '<span class="pill hearts" role="img" aria-label="' + run.hp + " of " + run.maxHp + ' hearts">' + hs + "</span>";
      h += '<button class="pill toolbtn" data-act="glass" title="Use a magnifying glass"' + (glassUsable() ? "" : " disabled") + ">" + toolIcon("glass") + save.inv.glass + "</button>";
      h += '<span class="pill" title="Hard hats">' + toolIcon("hat") + save.inv.hat + "</span>";
    }
    h += '<span class="pill" aria-label="' + save.coins + ' coins">' + coin() + fmt(save.coins) + "</span>";
    h += musicBtn();
    return '<div class="pills">' + h + "</div>";
  }

  function brand() { return '<div class="brand">' + lion("happy") + "Valuation Valley</div>"; }

  function vTitle() {
    return '<section class="title-screen">' +
      '<div class="title-top">' + musicBtn() + "</div>" +
      '<div class="title-hero">' + banner() + lion("happy", "lion-big") + "</div>" +
      '<div class="title-text">' +
        '<h1 class="game-name">Valuation Valley</h1>' +
        '<p class="tagline">Help Mr. Clarkson find out what his lumber company is worth, one stop at a time.</p>' +
        '<ul class="rules">' +
          "<li>" + heart(true).replace("<svg", '<svg width="26" height="26"') + "<span>Each level has five hearts. A wrong answer costs one.</span></li>" +
          "<li>" + coin().replace("<svg", '<svg width="26" height="26"') + "<span>Right answers earn coins. Spend them on tools before a level.</span></li>" +
          "<li>" + starIcon().replace("<svg", '<svg width="26" height="26"') + "<span>Finish a level and Mr. Clarkson’s numbers fill in.</span></li>" +
          "<li>" + trophy().replace("<svg", '<svg width="26" height="26"') + "<span>Finish all five stops to earn your award token for Canvas.</span></li>" +
        "</ul>" +
        (!save.email
          ? emailBox() + (hasProgress() && !emailPending ? '<button class="btn small" data-act="new-game">New game</button>' : "")
          : '<p class="who-line">Playing as <strong>' + esc(save.email) + "</strong></p>" +
            (hasProgress()
              ? '<div class="title-actions"><button class="btn primary" data-act="hub">Continue</button><button class="btn" data-act="new-game">New game</button></div>'
              : '<div class="title-actions"><button class="btn primary" data-act="hub">Start</button><button class="btn" data-act="new-game">Not you? Change email</button></div>')) +
        '<p class="credit">' + CREDIT + "</p>" +
      "</div></section>";
  }

  function clarkson() {
    if (save.done[5]) return "Thank you again! The business is worth about " + fmt(Math.round(evVal())) + ", and " + fmt(Math.round(eqVal())) + " to me after the bank. Play any stop again to practice.";
    if (save.done[4]) return "The River is done: everything after 2000 is worth " + fmt(Math.round(rv2000(G_LONG))) + " at the end of 2000, or " + fmt(Math.round(pvRv(G_LONG))) + " today. Next, the Counting House puts it all together; that path opens soon.";
    if (save.done[3]) return "So in 1996 I invest more than the yard earns: free cash flow is " + signed(Math.round(inv3().fcf)) + ". By 2000, growth slows and the yard throws off " + fmt(Math.round(FCF_LATER[2000])) + " a year. But my yard doesn’t close in 2000. Next stop, the River: what is everything after 2000 worth?";
    if (save.done[2]) return "The Mill is done: in 1996 the yard earns about " + fmt(Math.round(pro().nop)) + " after taxes, before anything goes to the bank. Next stop, the Lumber Yard. Profit isn’t cash: how much must I invest in the yard and in working capital?";
    if (save.done[1]) return "The Vault is done! Cash is what I own that the business doesn't need, and the notes and loans are what I owe. Each goes into the valuation exactly once. Next stop, the Mill: what does the yard earn from selling lumber, before anything goes to the bank?";
    return "Welcome to Valuation Valley! I'm Keith Clarkson. I've had offers for my lumber company, and I need to know what it's worth at the end of 1995. First stop, the Vault: what do I own that the business doesn't need, and what do I owe?";
  }

  function mvbs() {
    var f = !!save.done[1], f5 = !!save.done[5], pop = save.pop === 1 ? " pop" : "", pop5 = save.pop === 5 ? " pop" : "";
    var nonop = BS.filter(function (L) { return L.cls === "nonop"; }).reduce(function (s, L) { return s + L.v; }, 0);
    var debt = BS.filter(function (L) { return L.cls === "debt"; }).reduce(function (s, L) { return s + L.v; }, 0);
    function blk(c, label, sub, val, known) {
      return '<div class="blk ' + c + (known ? pop : " unknown") + '"><span class="bl">' + label + "</span>" + (sub ? '<span class="bs">' + sub + "</span>" : "") +
        '<span class="bv">' + (known ? fmt(val) : "?") + "</span></div>";
    }
    return '<div class="panel"><div class="panel-title">Mr. Clarkson’s balance sheet<small>market value, 12/31/1995, $ thousands</small></div>' +
      '<div class="mvbs-head"><span>Assets</span><span>Claims</span></div>' +
      '<div class="mvbs-grid"><div class="mvbs-col assets">' +
        blk5("ev", "Enterprise value", "PV of future free cash flows", evVal()) + blk("nonop", "Non-operating assets", "", nonop, f) + "</div>" +
      '<div class="mvbs-col claims">' + blk5("eq", "Equity", "EV + non-op. assets − debt", eqVal()) + blk("debt", "Debt", "", debt, f) + "</div></div></div>";
    function blk5(c, label, sub, val) {
      return '<div class="blk ' + c + (f5 ? pop5 : " unknown") + '"><span class="bl">' + label + '</span><span class="bs">' + sub + '</span><span class="bv">' + (f5 ? fmt(Math.round(val)) : "?") + "</span></div>";
    }
  }

  function ladder() {
    var f2 = !!save.done[2], f3 = !!save.done[3], q = inv3();
    var rows = [
      { n: "NOP", note: "the Mill", v: f2 ? Math.round(pro().nop) : null, pop: save.pop === 2 },
      { n: "− ΔNFA", note: "the Lumber Yard", v: f3 ? Math.round(q.dnfa) : null, pop: save.pop === 3 },
      { n: "− ΔNOWC", note: "the Lumber Yard", v: f3 ? Math.round(q.dnowc) : null, pop: save.pop === 3 },
      { n: "= FCF 1996", note: "", v: f3 ? Math.round(q.fcf) : null, cls: "fcf", pop: save.pop === 3 }
    ];
    return '<div class="panel"><div class="panel-title">Mr. Clarkson’s 1996 free cash flow<small>$ thousands</small></div><table class="ladder"><tbody>' +
      rows.map(function (r) {
        var val = r.v === null ? '<span class="unk">?</span>' : '<span class="val known' + (r.pop ? " pop" : "") + '">' + signed(r.v) + "</span>";
        return '<tr class="' + (r.cls || "") + '"><td>' + r.n + (r.note ? ' <span class="from">' + r.note + "</span>" : "") + "</td><td>" + val + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function fcfTable() {
    var q = inv3(), p = pro();
    var cols = [{ y: 1996, nop: p.nop, dnfa: q.dnfa, dnowc: q.dnowc, fcf: q.fcf }];
    [1997, 1998, 1999, 2000].forEach(function (y) { var t = TABLE5[y]; cols.push({ y: y, nop: t[0], dnfa: t[1], dnowc: t[2], fcf: FCF_LATER[y] }); });
    function row(label, k, cls) {
      return '<tr class="' + (cls || "") + '"><td>' + label + "</td>" + cols.map(function (c) { return '<td class="' + (c.y === 1996 ? "y96" : "") + '">' + signed(Math.round(c[k])) + "</td>"; }).join("") + "</tr>";
    }
    var mu = save.done[5] ? '<p class="rvline' + (save.pop === 5 ? " pop" : "") + '">Forward multiples: <strong>' + mult(SALES96) + "×</strong> sales · <strong>" + mult(pro().ebit) + "×</strong> EBIT</p>" : "";
    var rv = save.done[4] ? '<p class="rvline' + (save.pop === 4 ? " pop" : "") + '">Residual value at the end of 2000: <strong>' + fmt(Math.round(rv2000(G_LONG))) + "</strong> · worth <strong>" + fmt(Math.round(pvRv(G_LONG))) + "</strong> today</p>" : "";
    return '<div class="panel"><div class="panel-title">Mr. Clarkson’s free cash flow<small>1996–2000, $ thousands</small></div>' +
      '<div class="ex-scroll"><table class="fcf5' + (save.pop === 3 ? " pop" : "") + '"><thead><tr><th></th>' + cols.map(function (c) { return '<th class="' + (c.y === 1996 ? "y96" : "") + '">' + c.y + "</th>"; }).join("") + "</tr></thead><tbody>" +
      row("NOP", "nop") + row("− ΔNFA", "dnfa") + row("− ΔNOWC", "dnowc") + row("= FCF", "fcf", "fcf") +
      '</tbody></table></div><p class="fcfnote">You built 1996. 1997–2000 use the same assumptions.</p>' + rv + mu + "</div>";
  }

  function vHub() {
    var stops = LEVELS.map(function (L, i) {
      var state = !L.built || !unlocked(L) ? "locked" : (save.done[L.id] ? "done" : "open");
      var node = state === "locked" ? lockIcon() : (state === "done" ? starIcon() : stopIcon(L.icon));
      var chip = state === "done" ? '<span class="chip done">Done</span>' :
        (state === "locked" ? '<span class="chip locked">' + (L.built ? "Finish " + LEVELS[i - 1].name + " first" : "Opens later") + "</span>" : "");
      var act = state === "locked" ? "<span></span>" :
        '<button class="btn small ' + (state === "open" ? "primary" : "") + '" data-act="shop" data-level="' + L.id + '">' + (state === "open" ? "Go" : "Play again") + "</button>";
      return '<li class="stop ' + state + '"><span class="node">' + node + '</span><div><div class="nm">' + L.name + '</div><div class="tp">' + L.topic + "</div>" + chip + "</div>" + act + "</li>";
    }).join("");
    var html = '<section class="hub">' +
      '<div class="topbar">' + brand() + '<div class="top-right">' + (save.done[5] ? '<span class="pill trophy-pill">' + trophy() + "Valuation complete</span>" : "") + pills(false) + '<button class="btn small" data-act="reset-ask">New game</button></div></div>' +
      '<div class="reset-zone" id="reset-zone" role="status" aria-live="polite"></div>' +
      awardCard() +
      banner() +
      '<div class="hub-top">' + owner("owner") + '<div class="bubble"><p class="who">Keith Clarkson, owner of Clarkson Lumber</p><p class="say">' + clarkson() + "</p></div></div>" +
      '<div class="hub-grid"><div class="ledger-col">' + mvbs() + (save.done[3] ? fcfTable() : ladder()) + "</div>" +
        '<div class="panel"><div class="panel-title">The path</div><ol class="trail">' + stops + "</ol></div></div>" +
      '<footer class="hub-foot"><span>Playing as ' + esc(save.email || "") + " · Levels finished: " + save.clears + " · Times out of hearts: " + save.deaths + '</span><span class="credit">' + CREDIT + "</span></footer>" +
      "</section>";
    save.pop = 0; persist();
    return html;
  }

  function vShop() {
    var L = LEVELS[run.level - 1];
    var cards = Object.keys(TOOLS).map(function (k) {
      var t = TOOLS[k];
      return '<div class="tool"><span class="ic">' + toolIcon(k) + '</span><span class="tn">' + t.name + '</span><span class="td">' + t.desc + "</span>" +
        '<div class="tb"><span class="owned">You have ' + (save.inv[k] || 0) + '</span><button class="btn small gold" data-act="buy" data-tool="' + k + '"' + (save.coins < t.price ? " disabled" : "") + '><span class="price">' + coin() + t.price + "</span></button></div></div>";
    }).join("");
    return '<section class="shop">' +
      '<div class="topbar">' + brand() + pills(false) + "</div>" +
      '<div class="shop-head">' + lion("happy", "lion-mid") + '<div><h2>The tool shop</h2><p class="sub">Next stop: ' + L.name + " (" + L.topic.toLowerCase() + "). Buy tools now; you can't shop during a level. Tools you don't use stay in your pack.</p></div></div>" +
      '<div class="tools">' + cards + "</div>" +
      '<p class="shop-msg" role="status" aria-live="polite">' + esc(shopMsg) + "</p>" +
      '<div class="shop-actions"><button class="btn primary" data-act="start">Enter ' + L.name + '</button><button class="btn" data-act="hub">Back to the valley</button></div>' +
      "</section>";
  }

  function exTable(rows, opts) {
    opts = opts || {};
    return '<div class="ex-scroll"><table class="ex"><tbody>' + rows.map(function (r) {
      if (r.gap) return '<tr class="gap"><td colspan="2"></td></tr>';
      var cls = r.row || "", attrs = "";
      if (opts.hl && r.k === opts.hl) cls += " hl";
      var tag = opts.tagged && opts.tagged[r.k] ? '<span class="tag ' + opts.tagged[r.k] + '">' + (opts.tagged[r.k] === "debt" ? "Debt" : "Non-op") + "</span>" : "";
      if (opts.pick && r.cls) {
        if (opts.tagged && opts.tagged[r.k]) { cls += " static-row"; }
        else {
          cls += " pickable" + (opts.sel[r.k] ? " on" : "");
          attrs = ' data-act="row" data-row="' + r.k + '" role="button" tabindex="0" aria-pressed="' + (opts.sel[r.k] ? "true" : "false") + '"';
        }
      } else if (opts.pick) { cls += " static-row"; }
      return '<tr class="' + cls + '"' + attrs + "><td>" + esc(r.n) + tag + "</td><td>" + fmt(r.v) + "</td></tr>";
    }).join("") + "</tbody></table></div>";
  }

  function choiceCards(list, isWrong, isCrossed, isRight, act, big) {
    return '<div class="choices">' + list.map(function (c, i) {
      var cls = "choice", dis = run.answered;
      if (isWrong(c, i)) { cls += " wrong"; dis = true; }
      else if (isCrossed(c, i)) { cls += " crossed"; dis = true; }
      if (run.answered) cls += isRight(c, i) ? " right" : (cls.indexOf("wrong") < 0 && cls.indexOf("crossed") < 0 ? " dim" : "");
      return '<button class="' + cls + '" data-act="' + act + '" data-val="' + (c.k !== undefined ? c.k : i) + '"' + (dis ? " disabled" : "") + ">" +
        '<span class="ck">' + (c.k !== undefined ? catIcon(c.k) : "<span></span>") + '<span class="key">' + (i + 1) + "</span></span>" +
        '<span class="cn' + (big && /^[0-9.,%]+$/.test(c.t || "") ? " big" : "") + '">' + esc(c.n !== undefined ? c.n : c.t) + '</span><span class="cd">' + esc(c.d) + "</span></button>";
    }).join("") + "</div>";
  }

  function vLevel() {

      "<h2>Out of hearts</h2>" +
      "<p>No harm done. You keep your coins and your tools. Take a breath and try " + L.name + " again.</p>" +
      '<p class="statline">Step ' + (run.step + 1) + " of 5 · " + run.misses + " mistakes · +" + run.earned + " coins</p>" +
      '<form class="cheat" id="cheat-form" autocomplete="off"><label for="cheat">Ask your professor for the cheat code</label>' +
        '<div class="cheat-row"><input id="cheat" name="cheat" maxlength="20" spellcheck="false" autocapitalize="characters"><button class="btn small gold" type="submit">Use code</button></div>' +
        '<p class="cheat-msg" id="cheat-msg" role="status" aria-live="polite"></p></form>' +
      '<button class="btn primary" data-act="hub">Back to the valley</button></section>';
  }

  // ======================= reset =======================
  function askReset() {
    var z = document.getElementById("reset-zone");
    if (z) z.innerHTML = '<span>Start a new game? This erases coins, tools and Mr. Clarkson’s numbers.</span><button class="btn small primary" data-act="reset-yes">Yes, start over</button><button class="btn small" data-act="reset-no">Cancel</button>';
  }

  // ======================= events =======================
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b || b.disabled || b.getAttribute("aria-disabled") === "true") return;
    var a = b.getAttribute("data-act");
    if (a === "hub") goHub();
    else if (a === "shop") openShop(Number(b.getAttribute("data-level")));
    else if (a === "buy") buy(b.getAttribute("data-tool"));
    else if (a === "start") startLevel(run.level);
    else if (a === "stmt") answerStatement(b.getAttribute("data-which"));
    else if (a === "cat") answerCat(b.getAttribute("data-val"));
    else if (a === "build") answerBuild(Number(b.getAttribute("data-val")));
    else if (a === "glass") useGlass();
    else if (a === "row") toggleRow(b.getAttribute("data-row"));
    else if (a === "check") checkSelection();
    else if (a === "stmtcheck") checkStmt();
    else if (a === "year") answerYear(Number(b.getAttribute("data-year")));
    else if (a === "quiz") answerQuiz(Number(b.getAttribute("data-val")));
    else if (a === "mcard") clickCard(b.getAttribute("data-card"));
    else if (a === "mslot") clickSlot(b.getAttribute("data-slot"));
    else if (a === "mcheck") checkMatch();
    else if (a === "tcheck") checkTyped();
    else if (a === "next") next();
    else if (a === "reset-ask") askReset();
    else if (a === "reset-yes") { newGame(); view = "title"; render(); }
    else if (a === "reset-no") { var z = document.getElementById("reset-zone"); if (z) z.innerHTML = ""; }
    else if (a === "new-game") { newGame(); emailDraft = ""; emailPending = null; view = "title"; render(); }
    else if (a === "email-ok") confirmEmail();
    else if (a === "email-edit") editEmail();
    else if (a === "copy-token") copyToken();
    else if (a === "music") toggleMusic();
  });
  document.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "cheat-form") { e.preventDefault(); useCheat(); }
    if (e.target && e.target.id === "email-form") { e.preventDefault(); submitEmail(); }
  });
  document.addEventListener("keydown", function (e) {
    var t = e.target;
    if (t && t.getAttribute && t.getAttribute("data-tslot") && e.key === "Enter") { e.preventDefault(); checkTyped(); return; }
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    if (t && t.getAttribute && t.getAttribute("data-act") === "row" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleRow(t.getAttribute("data-row")); return; }
    if (t && t.getAttribute && t.getAttribute("data-act") === "stmt" && t.getAttribute("aria-disabled") !== "true" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); answerStatement(t.getAttribute("data-which")); return; }
    if (t && t.getAttribute && t.getAttribute("data-act") === "year" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); answerYear(Number(t.getAttribute("data-year"))); return; }
    if (t && t.getAttribute && t.getAttribute("data-act") === "mslot" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); clickSlot(t.getAttribute("data-slot")); return; }
    if (view !== "level" || !run || run.answered || !/^[1-3]$/.test(e.key)) return;
    var n = Number(e.key) - 1;
    if (cfg().match) return;
    if (cfg().quiz) { if (run.step >= 1) answerQuiz(n); return; }
    if (run.step >= 1 && run.step <= 3) answerCat(cfg().cats[n].k);
    else if (run.step === 4 && cfg().build) answerBuild(n);
  });

  document.addEventListener("dragstart", function (e) {
    var c = e.target && e.target.closest ? e.target.closest("[data-card]") : null;
    if (!c || !run || run.answered) return;
    e.dataTransfer.setData("text/plain", c.getAttribute("data-card")); e.dataTransfer.effectAllowed = "move";
  });
  document.addEventListener("dragover", function (e) {
    var sl = e.target && e.target.closest ? e.target.closest('[data-act="mslot"]') : null;
    if (sl) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; }
  });
  document.addEventListener("drop", function (e) {
    var sl = e.target && e.target.closest ? e.target.closest('[data-act="mslot"]') : null;
    if (!sl) return;
    e.preventDefault();
    var id = e.dataTransfer.getData("text/plain");
    if (id) placeCard(id, sl.getAttribute("data-slot"));
  });

  document.addEventListener("input", function (e) {
    var ts = e.target && e.target.getAttribute ? e.target.getAttribute("data-tslot") : null;
    if (ts && run) {
      run.typed[ts] = e.target.value.replace(/[^0-9]/g, "");
      if (e.target.value !== run.typed[ts]) e.target.value = run.typed[ts];
      if (/^[0-9]$/.test(run.typed[ts])) {   // one digit typed: hop to the next empty box
        var boxes = Array.prototype.slice.call(document.querySelectorAll(".tslot:not([readonly])")), i = boxes.indexOf(e.target);
        if (i >= 0 && i < boxes.length - 1) boxes[i + 1].focus();
      }
      return;
    }
    if (!e.target || e.target.id !== "gtry" || !run) return;
    run.gtry = Number(e.target.value);
    var v = document.getElementById("gval"), out = document.getElementById("gout");
    if (v) v.textContent = run.gtry.toFixed(1) + "%";
    if (out) out.innerHTML = gText(run.gtry);
  });

  // ======================= boot (keeps a game in progress across page updates) =======================
  function start(data) {
    if (data && data.view) { save = data.save || save; run = data.run || null; view = data.view; }
    if ((view === "level" || view === "won" || view === "dead" || view === "shop" || view === "complete") && !run) view = "hub";
    if (!save.email) view = "title";   // saves from before the award token have no email: ask for it, keep the progress
    render();
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(function () { return { save: save, run: run, view: view }; });
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
